site_name: OTSPI — Open Trusted Service Provider Initiative
site_url: https://about.otspi.org
site_description: Portail de gouvernance, statuts, conformité et documentation de l'association Open Trusted Service Provider Initiative (OTSPI).
site_author: Membres Fondateurs OTSPI

repo_name: otspi/organisation
repo_url: https://github.com/otspi/organisation
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 OTSPI — Contenu sous licence Creative Commons Attribution 4.0 International (CC-BY-4.0).

theme:
  name: material
  custom_dir: overrides
  language: fr
  palette:
    # Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  logo: assets/logo-header.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/otspi/organisation
    - icon: fontawesome/solid/globe
      link: https://about.otspi.org
    - icon: fontawesome/solid/envelope
      link: mailto:contact@otspi.org

nav:
  - Accueil: index.md
  - Statuts & Gouvernance:
      - Statuts de l'Association: statuts/statuts-association.md
      - Charte d'Éthique: gouvernance/charte-ethique.md
      - Organisation Technique & CPC: gouvernance/comite-technique.md
  - Règlement & Adhésion:
      - Règlement Intérieur: reglement-interieur/reglement-interieur.md
      - Bulletin & Procédure d'Adhésion: adhesion/bulletin-adhesion.md
  - Démarches Administratives:
      - Procès-Verbal Constitutif (Modèle): administratif/pv-ag-constitutive-modele.md
      - Demande de Rescrit Fiscal DGFIP: administratif/rescrit-fiscal-mecenat.md
      - Guide Démarches Préfecture (RNA, SIRET): administratif/declaration-prefecture.md
  - Socle Technique & Audit (TSP / PKI):
      - Vue d'ensemble: cadrage/index.md
      - Cadre CP/CPS (RFC 3647): cadrage/cp-cps-cadre.md
      - Politique de Sécurité des SI (PSSI): cadrage/pssi.md
      - Plan de Fin d'Activité (Termination Plan): cadrage/termination-plan.md
  - Transparence:
      - Registre des Réunions & PV: reunions/index.md
