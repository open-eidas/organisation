name: Déploiement du portail sur o2switch (FTPS)

# Déclenchement manuel tant que le DNS de about.otspi.org pointe vers GitHub Pages ;
# le déclenchement à chaque push sera ajouté au moment de la bascule (voir deploy/o2switch/README.md).
on:
  workflow_dispatch:

concurrency:
  group: "deploy-o2switch"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-pdf.txt
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 lftp

      - name: Build documentation
        run: mkdocs build --strict

      - name: Export whitepaper PDF
        run: python scripts/export_pdf.py

      - name: Cache veraPDF
        uses: actions/cache@v4
        with:
          path: ~/.cache/verapdf
          key: verapdf-1.30.2

      - name: Validate PDF/UA-1
        run: bash scripts/check_pdf_ua.sh

      - name: Add Apache configuration
        run: cp deploy/o2switch/htaccess site/.htaccess

      # Compte FTP dédié, cantonné au répertoire du site ; TLS obligatoire et certificat vérifié.
      - name: Déploiement FTPS
        env:
          FTP_HOST: ${{ vars.O2_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.O2_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.O2_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:max-retries 2;
            mirror --reverse --delete --verbose --no-perms --exclude '^\\.ftpquota$' --exclude '^cgi-bin/' ./site/ ./;
            bye"
